# CI Matrix Policy
#
# Category A (tools-version 6.2 + macOS 26 min): macos-26 + Swift 6.2
# Category B (tools-version 6.2 + older macOS):  macos-15 + 6.2, macos-26 + 6.2
# Category C (tools-version 6.0):                macos-15 + 6.0, macos-15 + 6.2, macos-26 + 6.2
# Linux:                                          ubuntu + Swift 6.3, ubuntu + Swift 6.4
#
# When bumping tools-version to 6.2: drop 6.0/6.1, move to Category A or B
#
# This package is Category A: the macOS 26 deployment target needs the macOS 26 SDK,
# so the macos-15 runners are out. Each platform also carries a 6.4 leg as a
# forward-compatibility check against the next toolchain. Linux carries no availability
# floor because swift-foundation marks these APIs always-available there, but
# Date.ParseStrategy.http reaches swift-corelibs-foundation only in Swift 6.3, which is
# the toolchain floor for every ubuntu job — including the documentation builds here and
# in documentation.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and Test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            swift: "6.2"
          - os: macos-26
            swift: "6.4"
          - os: ubuntu-latest
            swift: "6.3"
          - os: ubuntu-latest
            swift: "6.4"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: ${{ matrix.swift }}
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-test-${{ matrix.os }}-swift${{ matrix.swift }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -v
      - name: Test
        run: swift test -v
  documentation:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4"
      - name: Cache SwiftPM build products
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-docs-ubuntu-latest-swift6.4-${{ hashFiles('Package.resolved') }}
      - name: Build Documentation
        run: |
          swift package \
            --allow-writing-to-directory "$RUNNER_TEMP/docs" \
            generate-documentation \
            --target SwiftR2 \
            --warnings-as-errors \
            --output-path "$RUNNER_TEMP/docs"
  lint:
    name: Run SwiftLint
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:latest
    steps:
      - uses: actions/checkout@v6
      - name: Run SwiftLint
        run: swiftlint --strict
  swift-format:
    name: Run swift-format
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - uses: actions/checkout@v6
      - name: Download .swift-format config
        run: |
          apt-get update && apt-get install -y wget
          wget -O .swift-format https://gist.githubusercontent.com/RISCfuture/e0c21afb7bd80a88d128a42bf40d2ecd/raw/.swift-format
      - name: Run swift-format lint
        run: swift format lint --strict -r .
